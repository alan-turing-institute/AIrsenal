name: Docker build

# Only that the image builds and the CLI runs inside it. Lint and tests belong to
# main.yml; running them here too would say nothing it has not already said.

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]

concurrency:
  group: docker-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Build AIrsenal
        run: docker build -t airsenal .

      - name: Check the CLI runs in the image
        run: docker run --rm airsenal airsenal --help
