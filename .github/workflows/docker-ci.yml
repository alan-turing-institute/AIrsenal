name: Docker build

# Only that the image builds. Running the lint and the tests inside it as well
# duplicated main.yml exactly, so a failure told you nothing main.yml had not
# already told you, twice as slowly.

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]

concurrency:
  group: docker-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Build AIrsenal
        run: docker build -t airsenal .

      - name: Check the CLI runs in the image
        run: docker run --rm airsenal airsenal --help
