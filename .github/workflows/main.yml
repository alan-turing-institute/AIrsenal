name: Tests and code quality checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  pre-commit:
    name: Format + lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # No setup-python: uv installs the interpreter named by .python-version,
      # and caching is on by default on GitHub-hosted runners. Both pre-commit
      # itself and the local mypy hook (`uv run --extra dev mypy`) come out of
      # the project environment, so uv is all this job has to install.
      - uses: astral-sh/setup-uv@v10.0.1

      # The hook environments pre-commit builds for the non-local hooks; uv's
      # own cache does not cover these.
      - name: Cache the pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: >-
          uv run --extra dev pre-commit run
          --hook-stage manual --all-files --show-diff-on-failure

      # mypy and import-linter run here rather than as pre-commit hooks. Both
      # analyse the whole package at once, so neither has anything to narrow to
      # from a list of changed files - `lint-imports` does not even accept
      # filenames, because a layering violation is an edge between two modules
      # and needs the whole import graph. Both also need the project environment:
      # mypy was a `local` hook precisely because mirrors-mypy builds its own
      # from additional_dependencies, could not see sqlalchemy, pandas or bpl,
      # and so checked a much thinner picture of the code than `uv run mypy`
      # does - the two disagreed, and the hook both missed real errors and
      # invented ones that were not reproducible locally. Reproducing the project
      # environment in additional_dependencies means duplicating nearly every
      # dependency, resolved independently of uv.lock, which is the same trap.
      #
      # They are in this job so both gate the test matrix, which `needs` it.
      - name: Type check
        run: uv run --extra dev mypy

      # A wrong-direction import does not fail at runtime, so without this step
      # nothing in CI would ever notice one.
      - name: Check the package layering
        run: uv run --extra dev lint-imports --no-cache

  checks:
    name: Run tests for Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]  # test oldest and latest supported versions
        runs-on: [ubuntu-latest, macos-latest]  # can be extended to other OSes, e.g. [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # python-version overrides .python-version for the matrix entry.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      # --locked so a stale uv.lock is a CI failure rather than a silent
      # re-resolve. The dev *extra* carries pytest and friends; the dev
      # dependency group, which uv syncs by default, carries pytest-socket -
      # and the --disable-socket in addopts does not exist without it.
      - name: Install package
        run: uv sync --locked --extra dev

      # The default selection: offline, and without the two jax-heavy fits that
      # used to be 60% of the runtime. Coverage is opt-in, and scoped to src/
      # rather than measuring the tests as well.
      - name: Test package
        env:
          FPL_TEAM_ID: 742663
        run: >-
          uv run --extra dev pytest -ra --cov --cov-report=xml --cov-report=term
          --durations=20

      - name: Run the slow tests
        env:
          FPL_TEAM_ID: 742663
        run: uv run --extra dev pytest -ra -m slow --durations=20

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
          fail-on-error: false
