name: Nightly live API tests

# The `live` tests are the only ones that talk to the real FPL API. They are
# deselected everywhere else, so this job is the "did the API change shape?"
# signal - which the five tests that used to be permanently skipped by a
# `skipif(NEXT_GAMEWEEK == 1)` were written to give and never once gave.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  live:
    name: Live FPL API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install package
        run: python -m pip install .[dev]

      - name: Run the live tests
        env:
          FPL_TEAM_ID: 742663
        # --allow-hosts, not --disable-socket: these tests are supposed to reach
        # the network, and only these.
        run: >-
          python -m pytest -ra -m live --durations=20
          -p no:cacheprovider --force-enable-socket
