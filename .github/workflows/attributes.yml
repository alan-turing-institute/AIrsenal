name: Update FPL player attributes.

on:
  schedule:
    # Run at 09:09 every day, except June, July (off-season)
    - cron: "9 9 * 1,2,3,4,5,8,9,10,11,12 *"
  workflow_dispatch:

jobs:
  attributes:
    name: Update FPL player attributes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Editable, so that the packaged data directory the command appends to
      # is the one in this checkout rather than a copy in site-packages.
      - name: Install package
        run: python -m pip install -e .

      - name: Append the latest attributes
        run: airsenal dump attributes

      - name: Push updated attributes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/airsenal/resources
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Update player attributes log"
            git push origin main
          fi
