name: Update FPL player attributes.

on:
  schedule:
    # Run at 09:09 every day, except June, July (off-season)
    - cron: "9 9 * 1,2,3,4,5,8,9,10,11,12 *"
  workflow_dispatch:

jobs:
  attributes:
    name: Update FPL player attributes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # uv installs the interpreter named by .python-version.
      - uses: astral-sh/setup-uv@v10.0.1

      # uv installs the project itself editable, which is what this job needs:
      # the packaged data directory the command appends to has to be the one in
      # this checkout rather than a copy in site-packages. No dev tooling here.
      - name: Install package
        run: uv sync --locked --no-dev

      - name: Append the latest attributes
        run: uv run --no-dev airsenal dump attributes

      - name: Push updated attributes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/airsenal/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Update player attributes log"
            git push origin main
          fi
