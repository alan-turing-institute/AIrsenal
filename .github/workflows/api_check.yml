name: API check

# The `live` tests are the only ones that talk to the real FPL API. They are
# deselected everywhere else, so this job is the "did the API change shape?"
# signal.
#
# Weekly rather than daily: the FPL API changes shape between seasons and at the
# odd mid-season release, not overnight, and a daily run against someone else's
# API is seven requests-per-endpoint a week for one bit of information. Kick one
# off by hand with workflow_dispatch when a scrape or an ingest starts failing.

on:
  schedule:
    - cron: "17 5 * 1,2,3,4,5,8,9,10,11,12 1"
  workflow_dispatch:

jobs:
  live:
    name: Live FPL API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # uv installs the interpreter named by .python-version.
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install package
        run: uv sync --locked --extra dev

      - name: Run the live tests
        env:
          FPL_TEAM_ID: 742663
        # --allow-hosts, not --disable-socket: these tests are supposed to reach
        # the network, and only these.
        run: >-
          uv run --extra dev pytest -ra -m live --durations=20
          -p no:cacheprovider --force-enable-socket
