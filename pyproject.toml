[project]
name = "airsenal"
version = "1.16.0"
description = "AI manager for Fantasy Premier League"
authors = [
    {name = "Angus Williams", email = "anguswilliams91@gmail.com"},
    {name = "Jack Roberts", email = "jroberts@turing.ac.uk"},
    {name = "Nick Barlow", email = "nbarlow@turing.ac.uk"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<4"
dependencies = [
  "beautifulsoup4>=4.13.5",
  "bpl-next>=0.5.0",
  "curl-cffi>=0.13.0",
  "dateparser>=1.2.2",
  "deap>=1.4.3",
  "html5lib>=1.1",
  "jax>=0.6.2",
  "jaxlib>=0.6.2",
  "lxml>=6.0.1",
  "numpy>=2.2.6",
  "numpyro>=0.19.0",
  "pandas>=2.3.2",
  "platformdirs>=4.4.0",
  "python-dateutil>=2.9.0.post0",
  "regex>=2024.11.6",
  "rich>=13.0.0",
  "requests>=2.32.5",
  "scipy>=1.15.3",
  "sqlalchemy>=2.0.43",
  "typer>=0.16.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
notebook = ["jupyterlab>=4.1.2"]
plot = ["matplotlib>=3.8.3", "seaborn>=0.13.2"]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.16",
    "pre-commit>=4.3.0",
    "mypy>=2.1.0",
    "pytest-cov>=7.0.0",
    "pytest-sugar>=1.1.1",
    "types-dateparser>=1.2.2.20250809",
    "types-requests>=2.32.4.20250913",
    "types-python-dateutil>=2.9.0.20250822",
    "import-linter>=2.0",
]

[project.scripts]
airsenal = "airsenal.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airsenal"]
# Stray files written into the source tree (replay output, caches) must never be
# packaged just because they happen to sit inside the package directory.
exclude = ["**/Replay_*.json", "**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = ["src/airsenal", "tests", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = """
--cov=airsenal
--cov-report=xml
--strict-markers
-m 'not live'
"""
markers = [
  "live: makes real requests to the FPL API; deselected by default, run with -m live",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
docstring-code-format = true  # code snippets in docstrings will be formatted

[tool.ruff.lint]
select = [
  "E", "F", "W", # flake8
  "B",           # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "ISC",         # flake8-implicit-str-concat
  "G",           # flake8-logging-format
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "EXE",         # flake8-executable
]
ignore = [
  "PLR",    # Design related pylint codes
  "ISC001", # Conflicts with formatter
  "G004",   # f-strings with logger
]
flake8-unused-arguments.ignore-variadic-names = true  # allow unused *args/**kwargs

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
	"F401",  # allow unused imports in __init__.py files
]
"tests/**" = [
	"B011",  # allow using assert statements in tests
	"ARG001"  # allow unused arguments in tests, e.g. for pytest fixtures
]

[tool.mypy]
files = ["src/airsenal"]
show_error_codes = true
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
strict = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/airsenal"]
branch = true

[tool.importlinter]
root_package = "airsenal"
include_external_packages = true

# The point of the refactor is that these packages form a one-way chain. Without a
# check, a single convenience import quietly reintroduces the tangle that made
# framework/utils.py the module everything depended on - and it does not fail at
# runtime, so nothing catches it for months.
[[tool.importlinter.contracts]]
name = "Stage packages form a one-way dependency chain"
type = "layers"
layers = [
    "airsenal.cli",
    "airsenal.scripts",
    "airsenal.framework",
    "airsenal.reporting : airsenal.squad : airsenal.prediction",
    "airsenal.db",
    "airsenal.fetch",
    "airsenal.domain",
    "airsenal.core",
]
ignore_imports = [
    # Annotation only, under TYPE_CHECKING: a caller passes a fetcher when the
    # database has no fixtures to work the gameweek out from.
    "airsenal.db.queries.gameweeks -> airsenal.fetch.fpl_api",
]

# Query code returns data; rendering it and posting it anywhere belongs in
# reporting. framework/utils.py used to do all three in one function, which is why
# the data layer imported both Rich and an HTTP client.
#
# allow_indirect_imports: db may use a logger, and configuring that logger happens
# to involve Rich. What must not happen is db reaching for a renderer or an HTTP
# client itself.
[[tool.importlinter.contracts]]
name = "The database layer neither renders nor talks to the network"
type = "forbidden"
source_modules = ["airsenal.db"]
forbidden_modules = [
    "airsenal.core.console",
    "airsenal.reporting",
    "curl_cffi",
    "requests",
]
allow_indirect_imports = true
