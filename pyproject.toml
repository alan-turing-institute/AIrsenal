[project]
name = "airsenal"
version = "1.18.0"
description = "AI manager for Fantasy Premier League"
authors = [
    {name = "Angus Williams", email = "anguswilliams91@gmail.com"},
    {name = "Jack Roberts", email = "jroberts@turing.ac.uk"},
    {name = "Nick Barlow", email = "nbarlow@turing.ac.uk"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<4"
dependencies = [
  "beautifulsoup4>=4.13.5",
  "bpl-next>=0.5.0",
  "curl-cffi>=0.13.0",
  "dateparser>=1.2.2",
  "deap>=1.4.3",
  "html5lib>=1.1",
  "identify>=2.6.19",
  "jax>=0.6.2",
  "jaxlib>=0.6.2",
  "lxml>=6.0.1",
  "numpy>=2.2.6",
  "pandas>=2.3.2",
  "platformdirs>=4.4.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "python-dateutil>=2.9.0.post0",
  "rich>=13.0.0",
  "requests>=2.32.5",
  "sqlalchemy>=2.0.43",
  "typer>=0.16.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
api = ["Flask>=3.0.2"]
notebook = ["jupyterlab>=4.1.2"]
plot = ["matplotlib>=3.8.3", "seaborn>=0.13.2"]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.16",
    "pre-commit>=4.3.0",
    "mypy>=2.1.0",
    "pytest-cov>=7.0.0",
    "pytest-sugar>=1.1.1",
    "types-dateparser>=1.2.2.20250809",
    "types-requests>=2.32.4.20250913",
    "types-python-dateutil>=2.9.0.20250822",
]

[project.scripts]
airsenal = "airsenal.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = """
--cov=airsenal
--cov-report=xml
--pdbcls=IPython.terminal.debugger:TerminalPdb
"""

[tool.ruff]
line-length = 88

[tool.ruff.format]
docstring-code-format = true  # code snippets in docstrings will be formatted

[tool.ruff.lint]
select = [
  "E", "F", "W", # flake8
  "B",           # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "ISC",         # flake8-implicit-str-concat
  "G",           # flake8-logging-format
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "EXE",         # flake8-executable
]
ignore = [
  "PLR",    # Design related pylint codes
  "ISC001", # Conflicts with formatter
  "G004",   # f-strings with logger
]
flake8-unused-arguments.ignore-variadic-names = true  # allow unused *args/**kwargs

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
	"F401",  # allow unused imports in __init__.py files
]
"*/tests/*" = [
	"B011",  # allow using assert statements in tests
	"ARG001"  # allow unused arguments in tests, e.g. for pytest fixtures
]

[tool.mypy]
files = ["airsenal/framework", "airsenal/scripts"]
show_error_codes = true
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
strict = false
ignore_missing_imports = true
