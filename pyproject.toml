[project]
name = "airsenal"
version = "1.16.0"
description = "AI manager for Fantasy Premier League"
authors = [
    {name = "Angus Williams", email = "anguswilliams91@gmail.com"},
    {name = "Jack Roberts", email = "jroberts@turing.ac.uk"},
    {name = "Nick Barlow", email = "nbarlow@turing.ac.uk"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<4"
dependencies = [
  "beautifulsoup4>=4.13.5",
  "bpl-next>=0.5.0",
  "curl-cffi>=0.13.0",
  "dateparser>=1.2.2",
  "deap>=1.4.3",
  "html5lib>=1.1",
  "jax>=0.6.2",
  "jaxlib>=0.6.2",
  "lxml>=6.0.1",
  "numpy>=2.2.6",
  "numpyro>=0.19.0",
  "pandas>=2.3.2",
  "platformdirs>=4.4.0",
  "python-dateutil>=2.9.0.post0",
  "regex>=2024.11.6",
  "rich>=13.0.0",
  "requests>=2.32.5",
  "scipy>=1.15.3",
  "sqlalchemy>=2.0.43",
  "typer>=0.16.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
notebook = ["jupyterlab>=4.1.2"]
plot = ["matplotlib>=3.8.3", "seaborn>=0.13.2"]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.4",  # formats fenced Python in Markdown; see .pre-commit-config.yaml
    "pre-commit>=4.3.0",
    "mypy>=2.1.0",
    "pytest-cov>=7.0.0",
    "pytest-sugar>=1.1.1",
    "types-dateparser>=1.2.2.20250809",
    "types-requests>=2.32.4.20250913",
    "types-python-dateutil>=2.9.0.20250822",
    "import-linter>=2.13",  # `protected` contract type
]
# What the one-off scripts under tools/ need. Not packaged, and not needed to use
# AIrsenal; install with `uv sync --extra tools` to run them from a checkout.
tools = [
    "thefuzz>=0.22.1",
    "matplotlib>=3.8.3",
    "scipy>=1.15.3",
]

[project.scripts]
airsenal = "airsenal.cli.main:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.3.260113",
    "pytest-socket>=0.8.1",
    "types-regex>=2026.7.19.20260720",
]

[tool.hatch.build.targets.wheel]
packages = ["src/airsenal"]
# Stray files written into the source tree (replay output, caches) must not be
# packaged just because they sit inside the package directory.
exclude = ["**/Replay_*.json", "**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = ["src/airsenal", "tests", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is deliberately not here, so it does not run on every local
# invocation. Ask for it with --cov; [tool.coverage.run] scopes it to src/.
#
# --disable-socket makes "the suite runs offline" enforced rather than
# aspirational; unix sockets stay allowed because SQLite and multiprocessing
# need them.
addopts = """
--strict-markers
--strict-config
--disable-socket
--allow-unix-socket
-m 'not live and not slow'
"""
xfail_strict = true
markers = [
  "live: makes real requests to the FPL API; deselected by default, run with -m live",
  "slow: takes more than a couple of seconds; deselected by default, run with -m slow",
]

[tool.ruff]
line-length = 88
# Exploratory notebooks, not package code: cells are written to be run in order
# and read once, so the style rules this configuration turns on say little about
# them. What does matter is that they still import things that exist, because
# they are what CodingConventions.md points a new contributor at - and three
# package renames went by before anyone noticed six of them were broken.
# `tests/test_notebooks.py` checks exactly that, and nothing else.
exclude = ["notebooks"]

[tool.ruff.format]
docstring-code-format = true  # code snippets in docstrings will be formatted

[tool.ruff.lint]
select = [
  "E", "F", "W", # flake8
  "B",           # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "ISC",         # flake8-implicit-str-concat
  "G",           # flake8-logging-format
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "EXE",         # flake8-executable
  "TC",          # flake8-type-checking
  "N",           # pep8-naming
  "TID251",      # flake8-tidy-imports: banned-api (see below)
  # pydocstyle: the rules that pin Google-style sections, and the ones that keep
  # a docstring's first line a summary. Not the whole D family - D1xx would
  # require a docstring on everything and D417 every parameter documented once
  # any are, both of which push towards docstrings that restate the signature.
  # D212/D213 are also left out: this codebase opens a multi-line docstring on
  # the line after the quotes, and the two rules contradict each other anyway.
  "D200", "D202", "D205", "D209", "D403", "D415",
  "D405", "D410", "D411", "D412", "D414", "D416", "D418",
]
ignore = [
  # The size limits - PLR0913/0917/0912/0915 - are deliberately not ignored. They
  # are enabled, with the limits in [tool.ruff.lint.pylint] below. What stays
  # ignored is design advice about magic values and comparison style.
  #
  # flake8-annotations (ANN) is deliberately not enabled: mypy's strict mode
  # already requires annotations. Enabling ANN as well would mean a second list
  # of the same modules, and two lists drift.
  "PLR2004", "PLR0402", "PLR1702", "PLR5501", "PLR6301",
  "ISC001", # Conflicts with formatter
  "G004",   # f-strings with logger
]
flake8-unused-arguments.ignore-variadic-names = true  # allow unused *args/**kwargs

# Annotations are evaluated eagerly here, and that is the intended behaviour: an
# annotation naming something the module does not import at runtime is a mistake,
# not a style choice, and `from __future__ import annotations` hides it until
# someone calls `get_type_hints`. Quote the one-off self-reference instead.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Quote the annotation, or import the name at runtime."

[tool.ruff.lint.pydocstyle]
convention = "google"

# A ratchet, not a target: each number is today's worst offender, so nothing can
# get worse while the rest are split up. Lower them as that happens; never raise.
[tool.ruff.lint.pylint]
max-args = 13          # make_new_squad, calc_predicted_points_for_player
max-positional-args = 13  # make_new_squad
max-branches = 19      # find_fixture, FPLAuth._login_flow
max-statements = 80    # fill_attributes_table_from_api
max-returns = 12       # FPLAuth._login_flow

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
	"F401",  # allow unused imports in __init__.py files
]
"src/airsenal/cli/*.py" = [
	# A command's parameters are its public schema, set by the flags it offers
	# rather than by how the code behind it is organised. The bodies are a single
	# call each, so the count says nothing about their complexity.
	"PLR0913",
	"PLR0917",
]
"tests/**" = [
	"B011",  # allow using assert statements in tests
	"ARG001"  # allow unused arguments in tests, e.g. for pytest fixtures
]

[tool.mypy]
# `tools/` is checked too: the hyperparameter sweeps there call into the package
# with real models, and they went a whole refactor calling a signature that no
# longer existed because nothing checked them.
files = ["src/airsenal", "tools"]
strict = true
show_error_codes = true
warn_unreachable = true
# Not part of `strict`. Catches an override granting an exemption nothing needs
# any more, which costs nothing today and hides a real one tomorrow. It reports
# rather than gates, and is suppressed while any error is outstanding - so it will
# not be the thing that explains a wall of no-untyped-call errors from a renamed
# module in the carve-outs below.
warn_unused_configs = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
]

# Named rather than a blanket ignore_missing_imports, so a *new* untyped
# dependency is a decision rather than something that slips in unnoticed.
#
# Only what `files` above covers belongs here - `src/airsenal` and `tools` - since
# a library used only by the notebooks would be reported as an unused section
# forever by warn_unused_configs.
[[tool.mypy.overrides]]
module = [
    "bpl.*",
    "deap.*",
    "numpyro.*",
    "jax.*",
    "curl_cffi.*",
    "html5lib.*",
    "dateparser.*",
    "scipy.*",
    # only installed with the "plot" extra
    "matplotlib.*",
    # only used from tools/, with the "tools" extra
    "thefuzz.*",
]
ignore_missing_imports = true

# The only modules allowed to call into those untyped libraries. Everything else
# reaches them through our own typed wrappers.
[[tool.mypy.overrides]]
module = [
    "airsenal.prediction.team_models.dixon_coles",
    "airsenal.prediction.player_models.mcmc",
    "airsenal.optimization.squad_optimizers.genetic_algorithm",
]
disallow_untyped_calls = false
warn_return_any = false

# curl_cffi ships py.typed but leaves Response.json(), raise_for_status(),
# iter_content() and close() unannotated, so calling them is a "call to untyped
# function". These are the only modules that hold a curl_cffi Session, so the
# exemption stops with them - and unlike the block above it keeps warn_return_any,
# because narrowing the decoded payloads is exactly their job.
#
# All four sit inside `airsenal.remote`, which is the point: the exemption cannot
# spread, because nothing outside that package may import the client.
[[tool.mypy.overrides]]
module = [
    "airsenal.remote.fpl_api",
    "airsenal.remote.fpl_auth",
    "airsenal.remote.fpl_http",
    "airsenal.remote.download",
]
disallow_untyped_calls = false

[tool.coverage.run]
source = ["src/airsenal"]
branch = true

# A floor, not a target, and a ratchet like the complexity limits above: today's
# figure is 58%, so this fails a change that makes coverage meaningfully worse
# while leaving room for the run-to-run variation in the dummy fixtures. Raise it
# as coverage improves; never lower it. Without a number here the whole
# measurement was decoration - CI reported coverage and nothing acted on it, so
# deleting a test suite passed.
[tool.coverage.report]
fail_under = 57

[tool.importlinter]
root_package = "airsenal"
include_external_packages = true

# These packages form a one-way chain. Without a check, a single convenience
# import quietly reintroduces the tangle - and it does not fail at runtime, so
# nothing catches it for months.
[[tool.importlinter.contracts]]
name = "Stage packages form a one-way dependency chain"
type = "layers"
# One package per line, so every arrow is checked. Never `a : b` between siblings:
# that is import-linter's *permissive* delimiter and lets them import each other
# freely, which is the opposite of what this chain means.
#
# `game` is last, and that is the point: the facts about Fantasy Premier League -
# what a position is, what a goal is worth, what "2122" means - import nothing at
# all, not even a logger. tests/game/test_game_is_plain_python.py is what makes
# that boundary checkable rather than merely described.
#
# exhaustive: a newly-created package cannot silently escape the chain by not
# being listed. `airsenal.data` is exempt because it holds no Python.
containers = ["airsenal"]
layers = [
    "cli",
    "pipeline",
    "apply",
    "optimization",
    "export",
    "ingest",
    "reporting",
    "squad",
    "prediction",
    "db",
    "remote",
    "core",
    "game",
]
exhaustive = true
exhaustive_ignores = ["data"]
ignore_imports = [
    # Annotation only, under TYPE_CHECKING: a caller passes a fetcher when the
    # database has no fixtures to work the gameweek out from.
    "airsenal.db.queries.gameweeks -> airsenal.remote.fpl_api",
]

# The database layer reads and writes the database and does nothing else. The
# layers contract above cannot say this: `db` sits *above* `remote` in the chain,
# so importing it is legal there, and the "neither renders nor talks to the
# network" contract below allows reaching a client indirectly. This is what
# stops a query quietly turning into a live API call, which is what
# `free_hit_used_in_gameweek` was until it moved to `squad/state.py`.
#
# `protected` checks direct imports only, which is what is wanted: the one
# exemption is an annotation under TYPE_CHECKING, already excused in the layers
# contract above.
[[tool.importlinter.contracts]]
name = "The database layer does not reach for the FPL API"
type = "forbidden"
source_modules = ["airsenal.db"]
forbidden_modules = ["airsenal.remote.fpl_api", "airsenal.remote.fpl_auth"]
ignore_imports = [
    "airsenal.db.queries.gameweeks -> airsenal.remote.fpl_api",
]

# Query code returns data; rendering it and posting it anywhere belongs in
# reporting.
#
# allow_indirect_imports: db may use a logger, and configuring that logger happens
# to involve Rich. What must not happen is db reaching for a renderer or an HTTP
# client itself.
[[tool.importlinter.contracts]]
name = "The database layer neither renders nor talks to the network"
type = "forbidden"
source_modules = ["airsenal.db"]
forbidden_modules = [
    "airsenal.core.console",
    "airsenal.reporting",
    "curl_cffi",
    "matplotlib",
    "requests",
    "rich",
]
allow_indirect_imports = true

# One package owns the network, so there is one place to audit it, one place to
# mock, and one import to block. `airsenal.remote.errors` exists so that code
# above it can name an HTTP failure in an `except` clause without importing the
# client to do so.
#
# `protected` rather than `forbidden`: it checks *direct* imports only, which is
# exactly the distinction wanted here - everything above `remote` reaches these
# libraries through it, by design - and it needs no list of sibling packages, so a
# newly-created package cannot escape it by not being mentioned.
#
# Every name here has to be imported by something, or import-linter fails with
# ModuleNotPresent. If the Transfermarkt scraper is ever moved onto curl_cffi,
# drop the `requests` line in the same commit.
[[tool.importlinter.contracts]]
name = "Only the remote package talks to the network"
type = "protected"
protected_modules = [
    "bs4",
    "curl_cffi",
    "requests",
]
allowed_importers = ["airsenal.remote"]
