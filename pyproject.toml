[project]
name = "airsenal"
version = "1.16.0"
description = "AI manager for Fantasy Premier League"
authors = [
    {name = "Angus Williams", email = "anguswilliams91@gmail.com"},
    {name = "Jack Roberts", email = "jroberts@turing.ac.uk"},
    {name = "Nick Barlow", email = "nbarlow@turing.ac.uk"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<4"
dependencies = [
  "beautifulsoup4>=4.13.5",
  "bpl-next>=0.5.0",
  "curl-cffi>=0.13.0",
  "dateparser>=1.2.2",
  "deap>=1.4.3",
  "html5lib>=1.1",
  "jax>=0.6.2",
  "jaxlib>=0.6.2",
  "lxml>=6.0.1",
  "numpy>=2.2.6",
  "numpyro>=0.19.0",
  "pandas>=2.3.2",
  "platformdirs>=4.4.0",
  "python-dateutil>=2.9.0.post0",
  "regex>=2024.11.6",
  "rich>=13.0.0",
  "requests>=2.32.5",
  "scipy>=1.15.3",
  "sqlalchemy>=2.0.43",
  "typer>=0.16.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
notebook = ["jupyterlab>=4.1.2"]
plot = ["matplotlib>=3.8.3", "seaborn>=0.13.2"]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.16",
    "pre-commit>=4.3.0",
    "mypy>=2.1.0",
    "pytest-cov>=7.0.0",
    "pytest-sugar>=1.1.1",
    "types-dateparser>=1.2.2.20250809",
    "types-requests>=2.32.4.20250913",
    "types-python-dateutil>=2.9.0.20250822",
    "import-linter>=2.13",  # `protected` contract type
]
# One-off scripts under tools/, run from a checkout. Not packaged, and not
# needed to use AIrsenal - thefuzz in particular was imported by two of them
# while being declared nowhere, so they had simply been broken for a while.
tools = [
    "thefuzz>=0.22.1",
    "matplotlib>=3.8.3",
    "scipy>=1.15.3",
]

[project.scripts]
airsenal = "airsenal.cli.main:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.3.260113",
    "pytest-socket>=0.8.1",
    "types-regex>=2026.7.19.20260720",
]

[tool.hatch.build.targets.wheel]
packages = ["src/airsenal"]
# Stray files written into the source tree (replay output, caches) must never be
# packaged just because they happen to sit inside the package directory.
exclude = ["**/Replay_*.json", "**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = ["src/airsenal", "tests", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is deliberately not here: it ran on every local invocation, and
# --cov=airsenal measured the tests as well as the package, which is what made
# the headline number meaningless. Ask for it explicitly, and [tool.coverage.run]
# below scopes it to src/ with the tests outside the package.
#
# --disable-socket makes "the suite runs offline" enforced rather than
# aspirational; unix sockets stay allowed because SQLite and multiprocessing
# need them.
addopts = """
--strict-markers
--strict-config
--disable-socket
--allow-unix-socket
-m 'not live and not slow'
"""
xfail_strict = true
markers = [
  "live: makes real requests to the FPL API; deselected by default, run with -m live",
  "slow: takes more than a couple of seconds; deselected by default, run with -m slow",
]

[tool.ruff]
line-length = 88
# Exploratory notebooks, not package code. They were already failing lint before
# this refactor (the same 10 findings on main), so the pre-commit --all-files job
# in CI was failing on them; and they still import from `airsenal.framework.*`,
# which no longer exists, so linting them says nothing useful until they are
# updated or deleted.
exclude = ["notebooks"]

[tool.ruff.format]
docstring-code-format = true  # code snippets in docstrings will be formatted

[tool.ruff.lint]
select = [
  "E", "F", "W", # flake8
  "B",           # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "ISC",         # flake8-implicit-str-concat
  "G",           # flake8-logging-format
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "EXE",         # flake8-executable
  "TC",          # flake8-type-checking
  "N",           # pep8-naming
  "TID251",      # flake8-tidy-imports: banned-api (see below)
]
ignore = [
  # PLR0913/0917/0912/0915 (too many arguments, branches, statements) are
  # deliberately NOT here. Ignoring the whole PLR family is why a 300-line
  # function with 20 parameters passed lint. They are enabled with the limits set
  # to today's worst offender, so nothing can get worse while the remaining ones
  # are split up; the numbers below are a ratchet and should only ever go down.
  # What stays ignored is design advice about magic values and comparison style.
  #
  # flake8-annotations (ANN) is deliberately not enabled: mypy's strict mode
  # already requires annotations, module by module, against the migration list
  # in [tool.mypy]. Enabling ANN as well would mean a second list of the same
  # modules, and two lists drift.
  "PLR2004", "PLR0402", "PLR1702", "PLR5501", "PLR6301",
  "ISC001", # Conflicts with formatter
  "G004",   # f-strings with logger
]
flake8-unused-arguments.ignore-variadic-names = true  # allow unused *args/**kwargs

# Annotations are evaluated eagerly on the Python versions this supports, and that
# is the intended behaviour: an annotation naming something the module does not
# import at runtime is a mistake, not a style choice. `from __future__ import
# annotations` hides exactly that mistake until someone calls `get_type_hints`, and
# it is also what let four string-valued `TypeAlias` definitions sit in the tree
# broken on every version below 3.14. Quote the one-off self-reference instead.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Quote the annotation, or import the name at runtime."

# A ratchet, not a target: each number is today's worst offender, so nothing can
# get worse while the rest are split up. Lower them as that happens; never raise.
[tool.ruff.lint.pylint]
max-args = 19          # run_transfer_optimization
max-positional-args = 19
max-branches = 19      # get_fixtures, get_recent_scores, FPLDataFetcher.get_...
max-statements = 82    # fill_attributes_table_from_api
max-returns = 12       # fpl_http.get_json

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
	"F401",  # allow unused imports in __init__.py files
]
"src/airsenal/cli/*.py" = [
	# A command's parameters are its public schema, set by the flags it offers
	# rather than by how the code behind it is organised. The bodies are a single
	# call each, so the count says nothing about their complexity.
	"PLR0913",
	"PLR0917",
]
"tests/**" = [
	"B011",  # allow using assert statements in tests
	"ARG001"  # allow unused arguments in tests, e.g. for pytest fixtures
]

[tool.mypy]
files = ["src/airsenal"]
strict = true
show_error_codes = true
warn_unreachable = true
# `strict` does not include this. It catches the quiet failure: an override that
# grants an exemption nothing needs any more, which costs nothing today and hides
# a real one tomorrow - `thefuzz` and `seaborn` had both been dead here for a
# while. Note it is suppressed while any error is outstanding, so it will not
# explain a wall of no-untyped-call errors caused by a *renamed* module in the
# carve-out below; that case is loud on its own, just not self-evident. A note
# rather than an error: it reports, it does not gate.
warn_unused_configs = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
]

# Named rather than a blanket ignore_missing_imports, so a *new* untyped
# dependency is a decision rather than something that slips in unnoticed.
#
# This tracks what `src/airsenal` imports, which is all `files` above covers.
# `thefuzz` and `seaborn` were listed here and are deliberately not: nothing in
# the package imports them (thefuzz only from `tools/`, seaborn only from the
# notebooks), so with warn_unused_configs on they were reported as unused
# sections forever. If `tools/` is ever added to `files`, thefuzz comes back.
[[tool.mypy.overrides]]
module = [
    "bpl.*",
    "deap.*",
    "numpyro.*",
    "jax.*",
    "curl_cffi.*",
    "html5lib.*",
    "dateparser.*",
    "scipy.*",
    # only installed with the "plot" extra
    "matplotlib.*",
]
ignore_missing_imports = true

# The only modules allowed to call into those untyped libraries. Everything else
# reaches them through our own typed wrappers.
[[tool.mypy.overrides]]
module = [
    "airsenal.prediction.team_models.dixon_coles",
    "airsenal.prediction.player_models.mcmc",
    "airsenal.optimization.squad_optimizers.genetic_algorithm",
]
disallow_untyped_calls = false
warn_return_any = false

# curl_cffi ships py.typed but leaves Response.json(), raise_for_status(),
# iter_content() and close() unannotated, so calling them is a "call to untyped
# function". These two modules are the only ones that hold a curl_cffi Session,
# so the exemption stops here - and unlike the block above it keeps
# warn_return_any, because narrowing the decoded payloads is exactly their job.
#
# Both are now inside `airsenal.remote`, which is the point: the exemption cannot
# spread, because nothing outside that package is allowed to import the client.
#
# fpl_http holds the two request helpers, and fpl_auth the login flow, which
# makes its seven requests directly - so the exemption follows the session
# rather than the class that used to hold all three.
[[tool.mypy.overrides]]
module = [
    "airsenal.remote.fpl_api",
    "airsenal.remote.fpl_auth",
    "airsenal.remote.fpl_http",
    "airsenal.remote.download",
]
disallow_untyped_calls = false

[tool.coverage.run]
source = ["src/airsenal"]
branch = true

[tool.importlinter]
root_package = "airsenal"
include_external_packages = true

# The point of the refactor is that these packages form a one-way chain. Without a
# check, a single convenience import quietly reintroduces the tangle that made
# framework/utils.py the module everything depended on - and it does not fail at
# runtime, so nothing catches it for months.
[[tool.importlinter.contracts]]
name = "Stage packages form a one-way dependency chain"
type = "layers"
# One package per line, so every arrow is checked. `:` between siblings is
# import-linter's *permissive* delimiter - it lets them import each other freely -
# so the `reporting` boundary this file describes was not actually being enforced
# while `reporting : squad : prediction` sat on one line.
#
# `game` is last, and that is the point: the facts about Fantasy Premier League -
# what a position is, what a goal is worth, what "2122" means - import nothing at
# all, not even a logger. `core/` used to hold them alongside the generic
# plumbing under one negative rule ("no airsenal-specific dependencies"), which
# is a rule with no floor. See tests/game/test_game_is_plain_python.py, which is
# what makes the boundary checkable rather than merely described - the thing the
# earlier domain/ split (89fc5f2) never had.
#
# exhaustive: a newly-created package cannot silently escape the chain by not
# being listed. `airsenal.data` is exempt because it holds no Python.
containers = ["airsenal"]
layers = [
    "cli",
    "pipeline",
    "apply",
    "optimization",
    "export",
    "ingest",
    "reporting",
    "squad",
    "prediction",
    "db",
    "remote",
    "core",
    "game",
]
exhaustive = true
exhaustive_ignores = ["data"]
ignore_imports = [
    # Annotation only, under TYPE_CHECKING: a caller passes a fetcher when the
    # database has no fixtures to work the gameweek out from.
    "airsenal.db.queries.gameweeks -> airsenal.remote.fpl_api",
]

# Query code returns data; rendering it and posting it anywhere belongs in
# reporting. framework/utils.py used to do all three in one function, which is why
# the data layer imported both Rich and an HTTP client.
#
# allow_indirect_imports: db may use a logger, and configuring that logger happens
# to involve Rich. What must not happen is db reaching for a renderer or an HTTP
# client itself.
[[tool.importlinter.contracts]]
name = "The database layer neither renders nor talks to the network"
type = "forbidden"
source_modules = ["airsenal.db"]
forbidden_modules = [
    "airsenal.core.console",
    "airsenal.reporting",
    "curl_cffi",
    "matplotlib",
    "requests",
    "rich",
]
allow_indirect_imports = true

# One package owns the network, so there is one place to audit it, one place to
# mock, and one import to block. `pipeline`, `squad` and `ingest` each used to
# import curl_cffi for no reason other than to name its exceptions in an `except`
# clause - which is how an HTTP client became a dependency of the optimiser.
# `airsenal.remote.errors` exists so they have something else to catch.
#
# `protected` rather than `forbidden`: it checks *direct* imports only, which is
# exactly the distinction wanted here - everything above `remote` reaches these
# libraries through it, by design - and it needs no list of sibling packages, so a
# newly-created package cannot escape it by not being mentioned, for the same
# reason `exhaustive` is set on the chain above.
#
# Every name here has to be imported by something, or import-linter fails with
# ModuleNotPresent. If the Transfermarkt scraper is ever moved onto curl_cffi,
# drop the `requests` line in the same commit.
[[tool.importlinter.contracts]]
name = "Only the remote package talks to the network"
type = "protected"
protected_modules = [
    "bs4",
    "curl_cffi",
    "requests",
]
allowed_importers = ["airsenal.remote"]
