ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
        # exclude test data from test naming conventions
        exclude: ^tests/dummy_data\.py$
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.5"
    hooks:
      - id: ruff-check
        types_or: [ python, pyi, jupyter, pyproject ]
        args: [ "--fix", "--show-fixes" ]
      # Run the formatter. `markdown` is here because ruff formats fenced Python
      # in Markdown
      - id: ruff-format
        types_or: [ python, pyi, jupyter, markdown ]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --extra dev mypy
        language: system
        types_or: [ python, pyi ]
        files: ^(src/airsenal|tools)/
        pass_filenames: false

  - repo: https://github.com/seddonym/import-linter
    rev: v2.14
    hooks:
      - id: import-linter
        entry: uv run --extra dev lint-imports
