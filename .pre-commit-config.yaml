ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
        # The hook checks every tests/**/*.py and exempts only __init__.py and
        # conftest.py, so a module holding fixture data rather than tests has to
        # be listed here - the alternative is calling it test_something.py and
        # having it collected as a test file that contains no tests.
        exclude: ^tests/dummy_data\.py$
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.16"
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [ python, pyi, jupyter, pyproject ]
        args: [ "--fix", "--show-fixes" ]
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi, jupyter ]

  # additional_dependencies is the environment mypy gets, and it only needs the
  # libraries it has to *resolve*. The untyped ones named in
  # [[tool.mypy.overrides]] (jax, numpyro, bpl, deap, curl_cffi, html5lib,
  # dateparser, scipy, matplotlib) already have ignore_missing_imports, so they
  # can stay absent - which is why this list is six entries and not the whole
  # dependency table.
  #
  # Leaving any of them out is not a quiet loss of coverage but a loud wrong
  # answer: without sqlalchemy every query returns Any and strict mode reports
  # no-any-return all over db/queries, and without typer every CLI command is an
  # untyped-decorator error. That was 53 false positives against zero from
  # `uv run mypy`. If this hook and `uv run mypy` ever disagree, something is
  # missing here.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v2.1.0"
    hooks:
      - id: mypy
        files: ^src/airsenal/
        additional_dependencies:
          - types-dateparser
          - types-python-dateutil
          - types-requests
          - sqlalchemy
          - typer
          - pandas-stubs

  # Checks the layering contracts in pyproject.toml. Two things differ from the
  # hooks above, both from upstream being `language: system` rather than building
  # its own environment.
  #
  # `entry` is overridden to go through uv. Upstream runs a bare `lint-imports`,
  # which is only on PATH inside the project venv - so committing from a shell
  # without it activated fails with "Executable `lint-imports` not found", which
  # is a broken commit rather than a broken build. `uv run` resolves the project
  # environment itself, so it works either way. (additional_dependencies would
  # not help: system hooks ignore it.)
  #
  # And it takes no filenames - pass_filenames is false upstream. A layering
  # violation is an edge between two modules, so it needs the whole import graph
  # and there is nothing to narrow to from the files being committed. That is
  # affordable here: well under a second over 173 files.
  - repo: https://github.com/seddonym/import-linter
    rev: v2.13
    hooks:
      - id: import-linter
        entry: uv run --extra dev lint-imports
