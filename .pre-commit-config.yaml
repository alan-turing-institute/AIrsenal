ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
        # The hook checks every tests/**/*.py and exempts only __init__.py and
        # conftest.py, so a module holding fixture data rather than tests has to
        # be listed here - the alternative is calling it test_something.py and
        # having it collected as a test file that contains no tests.
        exclude: ^tests/dummy_data\.py$
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.16"
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [ python, pyi, jupyter, pyproject ]
        args: [ "--fix", "--show-fixes" ]
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi, jupyter ]
